<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет соединения — Чайхана Райхан</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f7f0e5;
        color: #24140d;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 22rem;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        color: #b51f24;
      }
      h1 {
        margin: 0 0 10px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.6rem;
        font-weight: 700;
      }
      p {
        margin: 0 0 22px;
        font-size: 0.95rem;
        line-height: 1.55;
        color: #7a6354;
      }
      a.call {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 999px;
        background: #b51f24;
        color: #fff;
        font-size: 0.92rem;
        font-weight: 600;
        text-decoration: none;
      }
      button.retry {
        display: block;
        margin: 14px auto 0;
        padding: 0;
        border: 0;
        background: none;
        color: #7a6354;
        font-size: 0.82rem;
        text-decoration: underline;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round">
          <rect x="11" y="11" width="26" height="26" rx="3" />
          <rect x="11" y="11" width="26" height="26" rx="3" transform="rotate(45 24 24)" />
        </g>
        <circle cx="24" cy="24" r="5.2" fill="currentColor" />
      </svg>

      <h1>Нет соединения</h1>
      <p>
        Страница не загрузилась — похоже, пропал интернет. Заказ можно сделать по телефону,
        мы на связи с 11:00 до 23:00.
      </p>

      <a class="call" href="tel:+79015165789">Позвонить: +7 (901) 516-57-89</a>
      <button class="retry" onclick="location.reload()">Попробовать снова</button>
    </div>
  </body>
</html>
